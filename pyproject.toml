[project]
name = "keyless-mcp"
version = "0.1.0"
description = "One MCP server wrapping free, no-auth public APIs, grouped into toolsets and tested with M3."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "SineFrame" }]
keywords = ["mcp", "model-context-protocol", "mcp-server", "public-apis", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "pyyaml>=6",
  "pydantic>=2",
  "anyio>=4",
]

[project.urls]
Homepage = "https://github.com/sineframe/keyless-mcp"
Repository = "https://github.com/sineframe/keyless-mcp"
Issues = "https://github.com/sineframe/keyless-mcp/issues"
Changelog = "https://github.com/sineframe/keyless-mcp/releases"

[project.scripts]
keyless-mcp = "keyless_mcp.__main__:main"

[dependency-groups]
dev = [
  "sf-m3[pytest,storage,judge]==0.3.2",
  "pytest>=8,<10",
  "pytest-timeout>=2.4,<3",
  "pytest-xdist>=3",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keyless_mcp"]

[tool.pytest.ini_options]
testpaths = ["m3_tests"]
timeout = 120
markers = [
  "live: hits the real network (excluded from PR CI)",
  "agent: drives a real agent harness and needs model access (excluded from PR CI)",
  "agent_fixture: scripted ACP agent, no model or keys, runs offline (included in PR CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "m3_tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
